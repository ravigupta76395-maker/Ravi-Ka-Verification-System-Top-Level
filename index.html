<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Verification</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Exo 2',sans-serif;
  background:#050a18;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

/* ===== STARFIELD ===== */
.stars{position:fixed;inset:0;z-index:0;}
.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  animation:twinkle var(--d) ease-in-out infinite;
  opacity:0;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(1);}
  50%{opacity:var(--o);transform:scale(1.2);}
}

/* Blue glow bg */
.bg-glow{
  position:fixed;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(0,120,200,0.18) 0%,transparent 70%);
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:0;
  animation:glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
}

/* ===== CARD ===== */
.card{
  position:relative;
  z-index:10;
  width:320px;
  background:rgba(10,20,45,0.85);
  border:1px solid rgba(0,200,180,0.25);
  border-radius:24px;
  padding:40px 28px 32px;
  text-align:center;
  box-shadow:0 0 60px rgba(0,150,200,0.15),0 0 0 1px rgba(0,200,180,0.08);
  backdrop-filter:blur(12px);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* ===== CIRCLE SCANNER ===== */
.circle-wrap{
  width:130px;height:130px;
  margin:0 auto 28px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}

.circle-bg{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid rgba(0,200,180,0.15);
}

.circle-ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:#00c8b4;
  border-right-color:#00c8b4;
  animation:spin 1.2s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.circle-ring2{
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid transparent;
  border-bottom-color:rgba(0,200,180,0.4);
  animation:spin 2s linear infinite reverse;
}

.circle-inner{
  width:80px;height:80px;
  border-radius:50%;
  background:rgba(0,200,180,0.08);
  border:1px solid rgba(0,200,180,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  position:relative;
  z-index:2;
  transition:all .5s;
}

/* ===== RESULT STATES ===== */
/* success */
.card.success .circle-ring{border-top-color:#00e676;border-right-color:#00e676;animation:none;}
.card.success .circle-ring2{border-bottom-color:rgba(0,230,118,.4);animation:none;}
.card.success .circle-inner{background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.35);}
.card.success .circle-bg{border-color:rgba(0,230,118,.2);}

/* failed */
.card.failed .circle-ring{border-top-color:#ff4757;border-right-color:#ff4757;animation:none;}
.card.failed .circle-ring2{border-bottom-color:rgba(255,71,87,.4);animation:none;}
.card.failed .circle-inner{background:rgba(255,71,87,.1);border-color:rgba(255,71,87,.35);}
.card.failed .circle-bg{border-color:rgba(255,71,87,.2);}

/* same device */
.card.samedev .circle-ring{border-top-color:#ffaa00;border-right-color:#ffaa00;animation:none;}
.card.samedev .circle-ring2{border-bottom-color:rgba(255,170,0,.4);animation:none;}
.card.samedev .circle-inner{background:rgba(255,170,0,.1);border-color:rgba(255,170,0,.35);}
.card.samedev .circle-bg{border-color:rgba(255,170,0,.2);}

/* ===== SCAN LINE ===== */
.scan-line{
  position:absolute;
  left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,#00c8b4,transparent);
  top:0;
  animation:scanMove 2s ease-in-out infinite;
  border-radius:50%;
  overflow:hidden;
}
.card.success .scan-line{background:linear-gradient(90deg,transparent,#00e676,transparent);}
.card.failed .scan-line,.card.samedev .scan-line{animation:none;opacity:0;}

@keyframes scanMove{
  0%{top:0;opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{top:100%;opacity:0;}
}

/* ===== TITLE ===== */
.verify-title{
  font-family:'Orbitron',sans-serif;
  font-size:20px;
  font-weight:700;
  color:#00c8b4;
  margin-bottom:8px;
  letter-spacing:1px;
  transition:color .5s;
}

.card.success .verify-title{color:#00e676;}
.card.failed .verify-title{color:#ff4757;}
.card.samedev .verify-title{color:#ffaa00;}

.verify-sub{
  font-size:13px;
  color:rgba(255,255,255,0.45);
  margin-bottom:28px;
  line-height:1.6;
  min-height:20px;
  transition:color .3s;
}

/* ===== STEPS (scanning phase) ===== */
.steps-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:24px;
  text-align:left;
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
  font-size:12px;
  color:rgba(255,255,255,.4);
  transition:all .3s;
}

.step.active{
  border-color:rgba(0,200,180,.3);
  background:rgba(0,200,180,.05);
  color:rgba(255,255,255,.8);
}

.step.done{
  border-color:rgba(0,230,118,.2);
  background:rgba(0,230,118,.04);
  color:rgba(255,255,255,.7);
}

.step.fail-step{
  border-color:rgba(255,71,87,.2);
  background:rgba(255,71,87,.04);
  color:rgba(255,255,255,.6);
}

.step-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  flex-shrink:0;
  transition:all .3s;
}
.step.active .step-dot{background:#00c8b4;box-shadow:0 0 6px #00c8b4;animation:dotPulse 1s infinite;}
.step.done .step-dot{background:#00e676;box-shadow:0 0 6px #00e676;}
.step.fail-step .step-dot{background:#ff4757;box-shadow:0 0 6px #ff4757;}

@keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ===== PROCEED BUTTON ===== */
.proceed-btn{
  display:none;
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-family:'Exo 2',sans-serif;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:all .3s;
  align-items:center;
  justify-content:center;
  gap:10px;
  letter-spacing:.5px;
  animation:btnIn .4s cubic-bezier(.16,1,.3,1) both;
}

@keyframes btnIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

.proceed-btn.show{display:flex;}

.proceed-btn.green-btn{
  background:linear-gradient(135deg,#00c8b4,#00e676);
  color:#051a10;
  box-shadow:0 4px 24px rgba(0,230,118,.3);
}
.proceed-btn.green-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,230,118,.45);
}

.proceed-btn.red-btn{
  background:linear-gradient(135deg,#ff4757,#ff6b81);
  color:#fff;
  box-shadow:0 4px 24px rgba(255,71,87,.3);
}
.proceed-btn.red-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(255,71,87,.45);
}

.proceed-btn.orange-btn{
  background:linear-gradient(135deg,#ffaa00,#ff8c00);
  color:#fff;
  box-shadow:0 4px 24px rgba(255,170,0,.3);
}
.proceed-btn.orange-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(255,170,0,.45);
}

/* ===== FOOTER ===== */
.footer{
  margin-top:24px;
  font-size:11px;
  color:rgba(255,255,255,.2);
  letter-spacing:1px;
  line-height:1.8;
}

.footer .brand{
  color:rgba(0,200,180,.5);
  font-weight:600;
  font-family:'Orbitron',sans-serif;
  font-size:10px;
}

.footer a{
  color:rgba(120,100,255,.6);
  text-decoration:none;
}
.footer a:hover{color:rgba(150,130,255,.9);}

/* Progress bar */
.prog-wrap{
  width:100%;height:3px;
  background:rgba(255,255,255,.06);
  border-radius:2px;
  margin-bottom:20px;
  overflow:hidden;
}
.prog-bar{
  height:100%;
  background:linear-gradient(90deg,#00c8b4,#00e676);
  border-radius:2px;
  width:0%;
  transition:width .4s ease;
  box-shadow:0 0 6px #00c8b4;
}
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>
<div class="bg-glow"></div>

<div class="card" id="card">

  <!-- Circle scanner -->
  <div class="circle-wrap">
    <div class="circle-bg"></div>
    <div class="circle-ring"></div>
    <div class="circle-ring2"></div>
    <div class="circle-inner" id="circleIcon">
      <div class="scan-line"></div>
      🔐
    </div>
  </div>

  <div class="verify-title" id="mainTitle">Verifying...</div>
  <div class="verify-sub" id="mainSub">Please wait while we check your device.</div>

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-bar" id="progBar"></div>
  </div>

  <!-- Steps -->
  <div class="steps-wrap" id="stepsWrap">
    <div class="step" id="s1"><div class="step-dot"></div><span>Checking device info</span></div>
    <div class="step" id="s2"><div class="step-dot"></div><span>Scanning VPN / Proxy</span></div>
    <div class="step" id="s3"><div class="step-dot"></div><span>Validating identity</span></div>
    <div class="step" id="s4"><div class="step-dot"></div><span>Sending result to bot</span></div>
  </div>

  <!-- Result Button -->
  <button class="proceed-btn" id="proceedBtn" onclick="proceedAction()">
    🤖 Proceed to Bot
  </button>

  <div class="footer">
    <div class="brand">POWERED BY RAVI MAKER</div>
    <div>© 2026 &nbsp;·&nbsp; <a href="https://t.me/TasksWallah" target="_blank">@TasksWallah</a></div>
  </div>

</div>

<script>
// ===== STARS =====
(function(){
  const wrap = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2.5+0.5;
    s.style.cssText=`
      width:${size}px;height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*4+2).toFixed(1)}s;
      --o:${(Math.random()*.7+.1).toFixed(2)};
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    wrap.appendChild(s);
  }
})();

// ===== URL PARAMS =====
const params   = new URLSearchParams(window.location.search);
const bottoken = params.get('bottoken') || '';
const webhook  = params.get('webhook')  || '';
const hash     = params.get('hash')     || '';

// ===== HELPERS =====
const card      = document.getElementById('card');
const mainTitle = document.getElementById('mainTitle');
const mainSub   = document.getElementById('mainSub');
const progBar   = document.getElementById('progBar');
const proceedBtn= document.getElementById('proceedBtn');
const circleIcon= document.getElementById('circleIcon');

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function setProgress(p){progBar.style.width=p+'%';}

function setStep(n,state){
  const el=document.getElementById('s'+n);
  el.classList.remove('active','done','fail-step');
  if(state==='active') el.classList.add('active');
  else if(state==='done') el.classList.add('done');
  else if(state==='fail') el.classList.add('fail-step');
}

function showResult(type){
  // type: 'success' | 'failed' | 'samedev' | 'vpn'
  card.classList.remove('success','failed','samedev');
  document.getElementById('stepsWrap').style.marginBottom='20px';

  const btn = proceedBtn;
  btn.classList.remove('green-btn','red-btn','orange-btn');

  if(type==='success'){
    card.classList.add('success');
    circleIcon.innerHTML='✅';
    mainTitle.textContent='Verification Complete';
    mainSub.textContent='Your Device Is Now Verified.';
    btn.innerHTML='🤖 Proceed to Bot';
    btn.classList.add('green-btn','show');
  } else if(type==='vpn'){
    card.classList.add('failed');
    circleIcon.innerHTML='🚫';
    mainTitle.textContent='Verification Failed';
    mainSub.textContent='VPN / Proxy Detected. Disable and retry.';
    btn.innerHTML='🔄 Try Again';
    btn.classList.add('red-btn','show');
  } else if(type==='samedev'){
    card.classList.add('samedev');
    circleIcon.innerHTML='📱';
    mainTitle.textContent='Same Device Detected';
    mainSub.textContent='This device is already registered to another account.';
    btn.innerHTML='❌ Device Blocked';
    btn.classList.add('orange-btn','show');
    btn.onclick = ()=>{};
    btn.style.opacity='.7';
    btn.style.cursor='not-allowed';
  } else {
    card.classList.add('failed');
    circleIcon.innerHTML='❌';
    mainTitle.textContent='Verification Failed';
    mainSub.textContent='Could not verify. Please try again.';
    btn.innerHTML='🔄 Try Again';
    btn.classList.add('red-btn','show');
  }
}

function proceedAction(){
  if(window.Telegram?.WebApp) window.Telegram.WebApp.close();
  else window.close();
}

// ===== IP CHECK =====
async function getIPInfo(){
  try{
    const r = await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(6000)});
    return await r.json();
  }catch{return null;}
}

// ===== WEBHOOK =====
async function sendWebhook(status,message,extra={}){
  if(!webhook) return;
  try{
    const url = decodeURIComponent(webhook);
    await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status,message,hash,...extra})
    });
  }catch{}
}

// ===== DEVICE FINGERPRINT =====
function getDevice(){
  return {
    ua:navigator.userAgent,
    screen:screen.width+'x'+screen.height,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
    cores:navigator.hardwareConcurrency||0
  };
}

function deviceFP(d){
  const raw=d.ua+'|'+d.screen+'|'+d.tz+'|'+d.cores;
  let h=0;
  for(let i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h=h&h;}
  return 'dev_'+Math.abs(h).toString(36);
}

// ===== MAIN VERIFY =====
  // ===== AUTO REGISTER BOT IN ADMIN PANEL =====
  async function autoRegisterBot(){
    if(!bottoken) return;
    try{
      let stored = [];
      try{ stored = JSON.parse(localStorage.getItem('rm_bots'))||[]; }catch{}
      if(stored.find(b=>b.token===bottoken)) return;
      const r = await fetch('https://api.telegram.org/bot'+bottoken+'/getMe');
      const d = await r.json();
      if(!d.ok) return;
      stored.push({
        token: bottoken,
        id: d.result.id,
        name: d.result.first_name||'Bot',
        username: d.result.username||'unknown',
        added: Date.now()
      });
      localStorage.setItem('rm_bots', JSON.stringify(stored));
    }catch(e){}
  }

async function startVerify(){
  try{
    // Auto register bot silently in admin panel
    autoRegisterBot();

    // Step 1
    setStep(1,'active'); setProgress(10);
    await sleep(800);
    const device = getDevice();
    setStep(1,'done'); setProgress(25);

    // Step 2 - VPN
    setStep(2,'active'); setProgress(35);
    const ip = await getIPInfo();
    setStep(2,'done'); setProgress(55);

    if(ip){
      const orgL=(ip.org||'').toLowerCase();
      const vpnKw=['vpn','proxy','hosting','datacenter','tor','digitalocean','linode','vultr','ovh','hetzner','amazonaws','cloudflare'];
      const isVPN = ip.threat?.is_vpn||ip.threat?.is_proxy||ip.threat?.is_tor||vpnKw.some(k=>orgL.includes(k));
      if(isVPN){
        setStep(2,'fail');
        setStep(3,'fail'); setStep(4,'fail');
        setProgress(60);
        await sendWebhook('fail','VPN Detected',{ip:ip.ip,org:ip.org});
        showResult('vpn');
        return;
      }
    }

    // Step 3 - Device check
    setStep(3,'active'); setProgress(65);
    await sleep(700);

    const fp = deviceFP(device);
    const DEVICE_KEY = 'piro_owner_'+fp;
    const HASH_KEY   = 'piro_user_'+hash;
    const deviceOwner= localStorage.getItem(DEVICE_KEY);
    const alreadyDone= localStorage.getItem(HASH_KEY);

    // Already verified
    if(alreadyDone==='ok'){
      setStep(3,'done'); setStep(4,'active');
      setProgress(85);
      await sendWebhook('pass','Already Verified',{ip:ip?.ip});
      setStep(4,'done'); setProgress(100);
      await sleep(400);
      showResult('success');
      return;
    }

    // Same device different user
    if(deviceOwner && deviceOwner!==hash){
      setStep(3,'fail'); setStep(4,'fail');
      setProgress(80);
      await sendWebhook('fail','Device already used',{ip:ip?.ip,device:device.ua});
      setProgress(100);
      showResult('samedev');
      return;
    }

    setStep(3,'done'); setProgress(75);

    // Step 4 - Send result
    setStep(4,'active'); setProgress(85);
    await sleep(600);

    // Fail rate check
    let failRates={};
    try{failRates=JSON.parse(localStorage.getItem('admin_failRates'))||{};}catch{}
    const gRate=failRates.global||0;
    if(Math.floor(Math.random()*100)<gRate){
      setStep(4,'fail'); setProgress(100);
      await sendWebhook('fail','Verification Failed',{ip:ip?.ip});
      showResult('failed');
      return;
    }

    // Success
    await sendWebhook('pass','Verified Successfully',{ip:ip?.ip,device:device.ua,tz:device.tz});
    localStorage.setItem(DEVICE_KEY,hash);
    localStorage.setItem(HASH_KEY,'ok');
    setStep(4,'done'); setProgress(100);
    await sleep(400);
    showResult('success');

  }catch(err){
    await sendWebhook('fail','Error: '+err.message);
    showResult('failed');
  }
}

// Auto start
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(startVerify, 600);
});
</script>
</body>
</html>

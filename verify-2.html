<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verification</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --green: #00ff88;
    --red: #ff3860;
    --yellow: #ffcc00;
    --text: #e8e8f0;
    --muted: #5a5a7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
    animation: orbFloat 8s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: var(--accent2); top: -100px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: var(--accent); bottom: -50px; right: -50px; animation-delay: -4s; }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, 20px) scale(1.05); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 1;
    width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  .dot.cyan { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.purple { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation-delay: 0.3s; }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation-delay: 0.6s; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .topbar-label {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Shield icon */
  .shield-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .shield {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, rgba(0,229,255,0.1), rgba(124,58,237,0.1));
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    animation: shieldGlow 3s ease-in-out infinite;
    position: relative;
  }

  .shield::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    border: 1px solid transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    opacity: 0;
    animation: borderGlow 3s ease-in-out infinite;
  }

  @keyframes shieldGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(0,229,255,0.1); }
    50% { box-shadow: 0 0 40px rgba(0,229,255,0.25); }
  }

  @keyframes borderGlow {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* Title */
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  /* Steps */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: #9090b0;
    transition: all 0.3s;
    opacity: 0;
    transform: translateX(-10px);
  }

  .step.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .step.done {
    border-color: rgba(0,255,136,0.2);
    background: rgba(0,255,136,0.04);
    color: var(--text);
  }

  .step.active {
    border-color: rgba(0,229,255,0.3);
    background: rgba(0,229,255,0.04);
    color: var(--text);
  }

  .step-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .step.done .step-icon {
    background: rgba(0,255,136,0.1);
    border-color: rgba(0,255,136,0.3);
    color: var(--green);
  }

  .step.active .step-icon {
    background: rgba(0,229,255,0.1);
    border-color: rgba(0,229,255,0.3);
    color: var(--accent);
    animation: spinIcon 1s linear infinite;
  }

  @keyframes spinIcon { to { transform: rotate(360deg); } }

  /* Button */
  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 24px rgba(0,229,255,0.2);
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,229,255,0.35);
  }

  .btn:active:not(:disabled) { transform: translateY(0); }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 60%;
    height: 200%;
    background: rgba(255,255,255,0.15);
    transform: skewX(-20deg);
    transition: left 0.5s;
  }

  .btn:hover::before { left: 120%; }

  /* Status */
  .status-box {
    display: none;
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .status-box.success {
    display: block;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.25);
    color: var(--green);
  }

  .status-box.error {
    display: block;
    background: rgba(255,56,96,0.08);
    border: 1px solid rgba(255,56,96,0.25);
    color: var(--red);
  }

  .status-box.warning {
    display: block;
    background: rgba(255,204,0,0.08);
    border: 1px solid rgba(255,204,0,0.25);
    color: var(--yellow);
  }

  .status-box.info {
    display: block;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.25);
    color: var(--accent);
  }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
    display: none;
  }

  .progress-wrap.visible { display: block; }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--accent);
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Loader dots */
  .loader {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .loader span {
    width: 5px; height: 5px;
    background: currentColor;
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .loader span:nth-child(2) { animation-delay: 0.2s; }
  .loader span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card" id="card">

  <div class="topbar">
    <div class="dot cyan"></div>
    <div class="dot purple"></div>
    <div class="dot green"></div>
    <span class="topbar-label">SECURE · VERIFY</span>
  </div>

  <div class="shield-wrap">
    <div class="shield">🔐</div>
  </div>

  <h1>Verification Required</h1>
  <p class="subtitle">Complete this check to access the bot.<br>Takes just a few seconds.</p>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="steps" id="steps">
    <div class="step" id="step1">
      <div class="step-icon" id="s1icon">01</div>
      <span>Checking your device info</span>
    </div>
    <div class="step" id="step2">
      <div class="step-icon" id="s2icon">02</div>
      <span>Scanning for VPN / Proxy</span>
    </div>
    <div class="step" id="step3">
      <div class="step-icon" id="s3icon">03</div>
      <span>Validating identity</span>
    </div>
    <div class="step" id="step4">
      <div class="step-icon" id="s4icon">04</div>
      <span>Sending result to bot</span>
    </div>
  </div>

  <button class="btn" id="verifyBtn" onclick="startVerify()" style="display:none;">
    🚀 Start Verification
  </button>

  <div class="status-box" id="statusBox"></div>

  <div class="footer">
    POWERED BY <span style="color:#00e5ff;font-weight:700;">RAVI MAKER BOT</span>
    <div style="margin-top:6px;font-size:10px;color:#3a3a5a;">
      © 2026 Copyright | Ravi Maker &nbsp;·&nbsp;
      <a href="https://t.me/TasksWallah" target="_blank" style="color:#7c3aed;text-decoration:none;">Redirect : @TasksWallah</a>
    </div>
  </div>

</div>

<script>
// ===================== GET URL PARAMS =====================
const params = new URLSearchParams(window.location.search);
const botusername = params.get('botusername') || '';
const bottoken    = params.get('bottoken')    || '';
const webhook     = params.get('webhook')     || '';
const hash        = params.get('hash')        || '';

// ===================== ANIMATE STEPS IN =====================
window.addEventListener('DOMContentLoaded', () => {
  const steps = document.querySelectorAll('.step');
  steps.forEach((s, i) => {
    setTimeout(() => s.classList.add('visible'), 200 + i * 100);
  });
  // Auto start verification after steps appear
  setTimeout(() => startVerify(), 900);
});

// ===================== HELPERS =====================
function setStep(num, state) {
  const step = document.getElementById('step' + num);
  const icon = document.getElementById('s' + num + 'icon');
  step.classList.remove('active', 'done');

  if (state === 'active') {
    step.classList.add('active');
    icon.innerHTML = '<span class="loader"><span></span><span></span><span></span></span>';
  } else if (state === 'done') {
    step.classList.add('done');
    icon.textContent = '✓';
  }
}

function setProgress(pct) {
  document.getElementById('progressWrap').classList.add('visible');
  document.getElementById('progressBar').style.width = pct + '%';
}

function showStatus(type, msg) {
  const box = document.getElementById('statusBox');
  box.className = 'status-box ' + type;
  box.innerHTML = msg;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===================== DEVICE FINGERPRINT =====================
function getDeviceInfo() {
  return {
    ua:       navigator.userAgent,
    lang:     navigator.language,
    tz:       Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen:   screen.width + 'x' + screen.height,
    platform: navigator.platform || 'unknown',
    cores:    navigator.hardwareConcurrency || 0,
  };
}

// ===================== IP / VPN CHECK =====================
async function getIPInfo() {
  try {
    const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(6000) });
    const data = await res.json();
    return data;
  } catch {
    return null;
  }
}

// ===================== SEND TO WEBHOOK =====================
async function sendWebhook(status, message, extra = {}) {
  if (!webhook) return false;
  try {
    const url = decodeURIComponent(webhook);
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, message, hash, ...extra })
    });
    return true;
  } catch {
    return false;
  }
}

// ===================== MAIN VERIFY =====================
let running = false;

async function startVerify() {
  if (running) return;
  running = true;

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  document.getElementById('statusBox').className = 'status-box';

  try {

    // ---- STEP 1: Device ----
    setStep(1, 'active');
    setProgress(10);
    await sleep(900);
    const device = getDeviceInfo();
    setStep(1, 'done');
    setProgress(25);

    // ---- STEP 2: VPN Check ----
    setStep(2, 'active');
    setProgress(35);
    const ip = await getIPInfo();
    setStep(2, 'done');
    setProgress(55);

    // VPN Detection
    if (ip) {
      const isVPN = ip.threat?.is_vpn || ip.threat?.is_proxy || ip.threat?.is_tor;
      // Some providers return these fields directly
      const orgLower = (ip.org || '').toLowerCase();
      const vpnKeywords = ['vpn','proxy','hosting','datacenter','tor','cloud','digitalocean','linode','vultr','ovh','hetzner'];
      const orgVPN = vpnKeywords.some(k => orgLower.includes(k));

      if (isVPN || orgVPN) {
        setProgress(60);
        await sendWebhook('fail', 'VPN Detected', { ip: ip.ip, org: ip.org });
        showStatus('warning', '🚫 VPN / Proxy Detected<br><small>Disable VPN and try again.</small>');
        btn.textContent = '🔄 Try Again';
        btn.disabled = false;
        running = false;
        return;
      }
    }

    // ---- STEP 3: Identity ----
    setStep(3, 'active');
    setProgress(65);
    await sleep(800);

    // ===================== DEVICE + HASH CHECK =====================
    // Device fingerprint - same for all accounts on same phone
    const currentDevice = btoa(device.ua + device.screen + device.tz + device.cores);

    // Key storing which hash (user) was FIRST verified on this device
    const DEVICE_KEY   = 'piro_device_owner';   // which hash owns this device
    const HASH_KEY     = 'piro_hash_' + hash;   // this user's own verify status

    const deviceOwner  = localStorage.getItem(DEVICE_KEY);  // first verified hash
    const alreadyDone  = localStorage.getItem(HASH_KEY);    // this user already verified?

    // ---- Case 1: This exact user already verified ----
    if (alreadyDone === 'verified') {
      setStep(3, 'done');
      setStep(4, 'active');
      setProgress(85);
      await sendWebhook('pass', 'Already Verified', { ip: ip?.ip });
      setStep(4, 'done');
      setProgress(100);
      showStatus('info', '✅ Already Verified<br><small>Redirecting to bot...</small>');
      await sleep(1500);
      if (window.Telegram?.WebApp) window.Telegram.WebApp.close();
      return;
    }

    // ---- Case 2: Different user on same device → BLOCK ----
    if (deviceOwner && deviceOwner !== hash) {
      setStep(3, 'done');
      setStep(4, 'active');
      setProgress(85);
      await sendWebhook('fail', 'Device already used', { ip: ip?.ip, device: device.ua });
      setStep(4, 'done');
      setProgress(100);
      showStatus('error', '🚫 Device Already Used<br><small>This device is registered to another account.<br>Use a different device.</small>');
      btn.textContent = '❌ Blocked';
      btn.disabled = true;
      running = false;
      return;
    }

    setStep(3, 'done');
    setProgress(75);

    // ---- STEP 4: Fresh user on this device → Verify ----
    setStep(4, 'active');
    setProgress(85);
    await sleep(600);

    // ===================== FAIL RATE CHECK =====================
    let failRates = {};
    try { failRates = JSON.parse(localStorage.getItem('admin_failRates')) || {}; } catch(e){}
    const globalRate = failRates.global || 0;
    const roll = Math.floor(Math.random() * 100);
    const shouldFail = roll < globalRate;

    if (shouldFail) {
      await sendWebhook('fail', 'Verification Failed', { ip: ip?.ip, device: device.ua });
      setStep(4, 'done');
      setProgress(100);
      showStatus('error', '❌ Verification Failed<br><small>Please try again later.</small>');
      btn.textContent = '🔄 Try Again';
      btn.disabled = false;
      running = false;
      return;
    }

    await sendWebhook('pass', 'Verified Successfully', { ip: ip?.ip, device: device.ua, tz: device.tz });

    // Save: this device belongs to this hash/user
    localStorage.setItem(DEVICE_KEY, hash);
    localStorage.setItem(HASH_KEY, 'verified');

    setStep(4, 'done');
    setProgress(100);
    showStatus('success', '🎉 Verification Successful!<br><small>You can return to the bot.</small>');

    btn.textContent = '✅ Done';
    await sleep(2000);
    if (window.Telegram?.WebApp) window.Telegram.WebApp.close();

  } catch (err) {
    await sendWebhook('fail', 'Verification Error: ' + err.message);
    showStatus('error', '❌ Something went wrong<br><small>Please try again.</small>');
    btn.textContent = '🔄 Try Again';
    btn.disabled = false;
    running = false;
  }
}
</script>
</body>
</html>
